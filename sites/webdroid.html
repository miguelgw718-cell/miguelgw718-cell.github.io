<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>WebDroid</title>
<style>
:root{--bg:#d9dde6;--sf:#fbfbfd;--fg:#14161c;--mut:#6a7080;--ln:#e2e5ec;--ac:#2f6df6;--bt:#eef1f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080b;--sf:#1b1d23;--fg:#eceef4;--mut:#9096a6;--ln:#2a2d36;--bt:#262a34}}
:root[data-theme="dark"]{--bg:#07080b;--sf:#1b1d23;--fg:#eceef4;--mut:#9096a6;--ln:#2a2d36;--bt:#262a34}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;color:var(--fg)}
#phone{position:relative;width:100%;max-width:400px;height:100%;max-height:820px;background:#0d0f14;overflow:hidden;display:flex;flex-direction:column;border-radius:clamp(0px,4vw,28px)}
#status{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#fff;font-size:12px;z-index:50;cursor:pointer;background:rgba(0,0,0,.25)}
#screen{flex:1;position:relative;overflow:hidden}
#home{position:absolute;inset:0;background:linear-gradient(160deg,#1d3a8a,#6b2fb3 55%,#e0567a);padding:18px 10px;overflow:auto}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;text-align:center;cursor:pointer;user-select:none}
.ic i{font-style:normal;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:28px;backdrop-filter:blur(6px)}
#win{position:absolute;inset:0;display:none}#win.on{display:block}
.app-root{position:absolute;inset:0;display:none;flex-direction:column;background:var(--sf);color:var(--fg);overflow:auto}
#nav{height:46px;flex:none;display:flex;justify-content:space-around;align-items:center;background:#000;z-index:30}
#nav button{background:none;border:0;color:#fff;font-size:20px;width:70px;height:40px;cursor:pointer}
#recents{position:absolute;inset:0;background:rgba(10,12,18,.94);display:none;flex-direction:column;gap:10px;padding:14px;overflow:auto;z-index:20}#recents.on{display:flex}
.card{background:var(--sf);color:var(--fg);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.card small{color:var(--mut)}.card .x{margin-left:auto}
#shade{position:absolute;inset:0;padding-top:28px;background:rgba(12,14,20,.97);transform:translateY(-100%);transition:transform .25s;z-index:40;display:flex;flex-direction:column;color:#fff}
#shade.on{transform:none}
#shade .hd{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
#nlist{flex:1;overflow:auto;padding:0 12px;display:flex;flex-direction:column;gap:8px}
.n{background:#23262f;border-radius:14px;padding:10px 12px;cursor:pointer}.n small{color:#9aa0b0}
#heads{position:absolute;left:10px;right:10px;top:34px;background:#2a2e3a;color:#fff;border-radius:16px;padding:10px 14px;z-index:45;transform:translateY(-140%);transition:transform .25s;cursor:pointer}#heads.on{transform:none}
#toast{position:absolute;left:50%;bottom:70px;translate:-50% 20px;background:#333;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;z-index:55;pointer-events:none;max-width:90%}#toast.on{opacity:1;translate:-50% 0}
#dlg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:60}#dlg.on{display:grid}
#dlg .box{background:var(--sf);color:var(--fg);border-radius:18px;padding:16px;width:85%}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);flex:none;flex-wrap:wrap}
.list{flex:1;overflow:auto}
.row{padding:12px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;cursor:pointer}
.row small{color:var(--mut)}.row .x{margin-left:auto;padding:0 6px}
button{background:var(--bt);color:var(--fg);border:0;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac)}
textarea,input:not([type=file]){background:var(--bt);color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:8px;font:13px ui-monospace,Consolas,monospace;width:100%}
.c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.c h1{font-size:64px;margin:0}
</style></head><body>
<div id="phone">
 <div id="status"><span id="clock"></span><span id="badge"></span></div>
 <div id="screen"><div id="home"><div id="grid"></div></div><div id="win"></div><div id="recents"></div></div>
 <div id="nav"><button id="back" aria-label="Voltar">◀</button><button id="homeb" aria-label="Início">●</button><button id="rec" aria-label="Recentes">■</button></div>
 <div id="shade"><div class="hd"><b>Notificações</b><button id="clr">Limpar tudo</button></div><div id="nlist"></div></div>
 <div id="heads"></div><div id="toast"></div><div id="dlg"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Sistema de arquivos virtual (persistido em localStorage) ===== */
class FS{
 constructor(){this.root={t:'d',c:{}};try{const s=localStorage.getItem('wd_fs');if(s)this.root=JSON.parse(s)}catch(e){}
  if(!Object.keys(this.root.c).length)['sdcard/Documents','data/app'].forEach(p=>this.mkdir(p))}
 _p(p){return p.split('/').filter(Boolean)}
 _n(p){let n=this.root;for(const s of this._p(p)){if(n.t!=='d'||!(s in n.c))return null;n=n.c[s]}return n}
 _par(p){const a=this._p(p),name=a.pop();return[this._n(a.join('/')),name]}
 save(){try{localStorage.setItem('wd_fs',JSON.stringify(this.root))}catch(e){}}
 exists(p){return !!this._n(p)}
 stat(p){const n=this._n(p);if(!n)throw Error('ENOENT: '+p);return{isDir:n.t==='d',size:n.t==='f'?n.d.length:0,mtime:n.m}}
 readdir(p){const n=this._n(p);if(!n||n.t!=='d')throw Error('ENOTDIR: '+p);return Object.keys(n.c).sort()}
 readFile(p){const n=this._n(p);if(!n||n.t!=='f')throw Error('ENOENT: '+p);return n.d}
 writeFile(p,d){const[a,name]=this._par(p);if(!a||a.t!=='d')throw Error('ENOENT: '+p);a.c[name]={t:'f',d:String(d),m:Date.now()};this.save()}
 mkdir(p){let n=this.root;for(const s of this._p(p)){n.c[s]=n.c[s]||{t:'d',c:{},m:Date.now()};n=n.c[s]}this.save()}
 rm(p){const[a,name]=this._par(p);if(a&&a.c&&a.c[name]){delete a.c[name];this.save()}}
}

/* ===== Classe base dos apps ===== */
class AndroidApp{
 constructor(sys,pid,root,manifest){this.sys=sys;this.pid=pid;this.root=root;this.manifest=manifest}
 onCreate(){} onResume(){} onPause(){} onDestroy(){}
 onBack(){return false} // retorne true para consumir o "voltar"
}

/* ===== Kernel ===== */
const S={fs:new FS(),reg:{},procs:{},nextPid:100,fg:null,notifs:[]};
S.parse=t=>{const m=typeof t==='string'?JSON.parse(t):t;
 if(m.format!=='apkx/1')throw Error('format deve ser "apkx/1"');
 for(const k of['id','name','main','code'])if(!m[k])throw Error('campo ausente: '+k);
 m.permissions=m.permissions||[];m.icon=m.icon||'📦';m.version=m.version||'1.0';
 new Function('AndroidApp',m.code+'\nreturn '+m.main);return m};
S.install=m=>{S.fs.writeFile('/data/app/'+m.id+'.apkx',JSON.stringify(m));S.reg[m.id]=m;renderGrid()};
S.uninstall=id=>{Object.values(S.procs).filter(p=>p.m.id===id).forEach(p=>S.kill(p.pid));S.fs.rm('/data/app/'+id+'.apkx');delete S.reg[id];renderGrid()};
S.load=()=>{S.reg={};for(const f of S.fs.readdir('/data/app')){try{const m=S.parse(S.fs.readFile('/data/app/'+f));S.reg[m.id]=m}catch(e){console.warn(f,e)}}};

S.api=p=>{const m=p.m,need=k=>{if(!m.permissions.includes(k))throw Error('Permissão negada: '+k)};
 const fs={};['readFile','writeFile','readdir','mkdir','rm','exists','stat'].forEach(k=>fs[k]=(...a)=>(need('fs'),S.fs[k](...a)));
 return{fs,pid:p.pid,manifest:m,toast:S.toast,prompt:S.prompt,confirm:S.confirm,
  notify:o=>(need('notifications'),S.notify(m,o)),
  proc:{
   list:()=>(need('process'),Object.values(S.procs).map(q=>({pid:q.pid,name:q.m.name,workers:q.workers.length,uptime:Math.floor((Date.now()-q.start)/1000)}))),
   kill:pid=>(need('process'),S.kill(pid)),
   spawn:(fn,cb)=>{need('process');const src='const post=postMessage;('+fn.toString()+')(post);';
    const w=new Worker(URL.createObjectURL(new Blob([src])));w.onmessage=e=>cb&&cb(e.data);p.workers.push(w);return w}},
  apps:{list:()=>Object.values(S.reg),launch:id=>S.launch(id),
   install:t=>{need('apps');const x=S.parse(t);S.install(x);return x},
   uninstall:id=>{need('apps');S.uninstall(id)}}}};

S.launch=id=>{const m=S.reg[id];if(!m)return;
 let p=Object.values(S.procs).find(q=>q.m.id===id);
 if(!p){const pid=S.nextPid++,root=document.createElement('div');root.className='app-root';$('#win').append(root);
  p={pid,m,root,workers:[],start:Date.now()};S.procs[pid]=p;
  try{const C=new Function('AndroidApp',m.code+'\nreturn '+m.main)(AndroidApp);p.inst=new C(S.api(p),pid,root,m);p.inst.onCreate()}
  catch(e){S.toast(m.name+' parou: '+e.message);S.kill(pid);return}}
 S.show(p)};
S.show=p=>{if(S.fg&&S.fg!==p)S.pause();S.fg=p;
 for(const q of Object.values(S.procs))q.root.style.display=q===p?'flex':'none';
 $('#win').classList.add('on');$('#recents').classList.remove('on');try{p.inst.onResume()}catch(e){}};
S.pause=()=>{if(S.fg)try{S.fg.inst.onPause()}catch(e){}};
S.home=()=>{S.pause();S.fg=null;$('#win').classList.remove('on');$('#recents').classList.remove('on');$('#shade').classList.remove('on')};
S.kill=pid=>{const p=S.procs[pid];if(!p)return;try{p.inst&&p.inst.onDestroy()}catch(e){}
 p.workers.forEach(w=>w.terminate());p.root.remove();delete S.procs[pid];
 if(S.fg===p){S.fg=null;$('#win').classList.remove('on')}renderRecents()};

/* ===== UI do sistema ===== */
S.toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(S.tt);S.tt=setTimeout(()=>e.classList.remove('on'),2200)};
S.dialog=(msg,def,isP)=>new Promise(r=>{const d=$('#dlg');
 d.innerHTML='<div class="box"><p></p>'+(isP?'<input>':'')+'<div class="bar" style="border:0;padding:8px 0 0;justify-content:flex-end"><button data-o="0">Cancelar</button><button data-o="1">OK</button></div></div>';
 d.querySelector('p').textContent=msg;const i=d.querySelector('input');if(i){i.value=def||'';setTimeout(()=>i.focus())}
 d.classList.add('on');d.onclick=e=>{const o=e.target.dataset.o;if(o===undefined)return;d.classList.remove('on');r(o==='1'?(isP?i.value:true):(isP?null:false))}});
S.prompt=(m,d)=>S.dialog(m,d,true);S.confirm=m=>S.dialog(m,'',false);
S.notify=(m,o)=>{const n={id:Math.random(),app:m.name,icon:m.icon,appId:m.id,title:o.title||m.name,text:o.text||'',time:new Date()};
 S.notifs.unshift(n);renderNotifs();
 const h=$('#heads');h.innerHTML='<b>'+esc(n.icon+' '+n.title)+'</b><br>'+esc(n.text);h.dataset.app=m.id;h.classList.add('on');
 clearTimeout(S.ht);S.ht=setTimeout(()=>h.classList.remove('on'),3000);return n.id};
function renderNotifs(){$('#badge').textContent=S.notifs.length?'🔔 '+S.notifs.length:'';
 $('#nlist').innerHTML=S.notifs.map(n=>'<div class="n" data-id="'+n.id+'"><small>'+esc(n.icon+' '+n.app+' · '+n.time.toLocaleTimeString().slice(0,5))+'</small><br><b>'+esc(n.title)+'</b><br>'+esc(n.text)+'</div>').join('')||'<small style="padding:8px">Sem notificações</small>'}
$('#nlist').onclick=e=>{const el=e.target.closest('.n');if(!el)return;const n=S.notifs.find(x=>String(x.id)===el.dataset.id);
 S.notifs=S.notifs.filter(x=>x!==n);renderNotifs();$('#shade').classList.remove('on');if(n)S.launch(n.appId)};
$('#clr').onclick=()=>{S.notifs=[];renderNotifs()};
$('#heads').onclick=e=>{e.currentTarget.classList.remove('on');S.launch(e.currentTarget.dataset.app)};
$('#status').onclick=()=>$('#shade').classList.toggle('on');

function renderGrid(){const g=$('#grid');g.innerHTML='';
 Object.values(S.reg).forEach(m=>{const d=document.createElement('div');d.className='ic';d.innerHTML='<i>'+esc(m.icon)+'</i>'+esc(m.name);
  let t;d.onpointerdown=()=>{t=setTimeout(async()=>{t=0;if(await S.confirm('Desinstalar '+m.name+'?'))S.uninstall(m.id)},700)};
  d.onpointerup=d.onpointerleave=()=>{clearTimeout(t)};d.onclick=()=>{if(t!==0)S.launch(m.id)};g.append(d)})}
function renderRecents(){const r=$('#recents');const l=Object.values(S.procs);
 r.innerHTML=(l.map(p=>'<div class="card" data-id="'+p.m.id+'"><span style="font-size:24px">'+esc(p.m.icon)+'</span><div><b>'+esc(p.m.name)+'</b><br><small>PID '+p.pid+'</small></div><button class="x" data-k="'+p.pid+'">✖</button></div>').join('')||'<div style="color:#fff;margin:auto">Nenhum app aberto</div>')+(l.length?'<button id="kall">Fechar tudo</button>':'')}
$('#recents').onclick=e=>{const k=e.target.dataset.k;if(k){S.kill(+k);return}if(e.target.id==='kall'){Object.keys(S.procs).forEach(p=>S.kill(+p));return}
 const c=e.target.closest('.card');if(c)S.launch(c.dataset.id)};
$('#back').onclick=()=>{const sh=$('#shade'),rc=$('#recents');
 if(sh.classList.contains('on'))return sh.classList.remove('on');if(rc.classList.contains('on'))return rc.classList.remove('on');
 if(S.fg){let used=false;try{used=S.fg.inst.onBack()}catch(e){}if(!used)S.kill(S.fg.pid)}};
$('#homeb').onclick=S.home;
$('#rec').onclick=()=>{renderRecents();$('#recents').classList.toggle('on')};
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString().slice(0,5)},1000);$('#clock').textContent=new Date().toLocaleTimeString().slice(0,5);

/* ===== Apps embutidos (mesmo formato .apkx dos apps de terceiros) ===== */
const B=[
{id:'wd.files',name:'Arquivos',icon:'📁',permissions:['fs','apps'],main:'Files',code:String.raw`class Files extends AndroidApp{
 onCreate(){this.cwd='/sdcard';this.ed=null;this.render()}
 join(n){return (this.cwd==='/'?'':this.cwd)+'/'+n}
 render(){const fs=this.sys.fs,r=this.root;
  if(this.ed){r.innerHTML='<div class="bar"><b>'+this.ed+'</b></div><textarea style="flex:1;border-radius:0"></textarea><div class="bar"><button data-a="save">Salvar</button><button data-a="close">Fechar</button></div>';
   r.querySelector('textarea').value=fs.readFile(this.ed)}
  else{let h='<div class="bar"><b>'+this.cwd+'</b></div><div class="list">';
   if(this.cwd!=='/')h+='<div class="row" data-a="up">📁 ..</div>';
   for(const n of fs.readdir(this.cwd)){const p=this.join(n),d=fs.stat(p).isDir;h+='<div class="row" data-p="'+p+'" data-d="'+(d?1:0)+'">'+(d?'📁':'📄')+' '+n+'<span class="x" data-del="'+p+'">🗑</span></div>'}
   r.innerHTML=h+'</div><div class="bar"><button data-a="mkdir">+ Pasta</button><button data-a="new">+ Arquivo</button></div>'}
  r.onclick=async e=>{const t=e.target,d=t.dataset,row=t.closest('.row');
   if(d.del){if(await this.sys.confirm('Apagar '+d.del+'?')){fs.rm(d.del);this.render()}return}
   if(d.a==='up'){this.cwd=this.cwd.replace(/\/[^\/]*$/,'')||'/';return this.render()}
   if(d.a==='mkdir'){const n=await this.sys.prompt('Nome da pasta');if(n){fs.mkdir(this.join(n));this.render()}return}
   if(d.a==='new'){const n=await this.sys.prompt('Nome do arquivo');if(n){fs.writeFile(this.join(n),'');this.render()}return}
   if(d.a==='save'){fs.writeFile(this.ed,r.querySelector('textarea').value);return this.sys.toast('Salvo')}
   if(d.a==='close'){this.ed=null;return this.render()}
   if(row&&row.dataset.p){const p=row.dataset.p;
    if(row.dataset.d==='1'){this.cwd=p;return this.render()}
    if(p.endsWith('.apkx')){if(await this.sys.confirm('Instalar '+p+'?')){try{const m=this.sys.apps.install(fs.readFile(p));this.sys.toast(m.name+' instalado')}catch(x){this.sys.toast('Erro: '+x.message)}}return}
    this.ed=p;this.render()}}}
 onBack(){if(this.ed){this.ed=null;this.render();return true}if(this.cwd!=='/sdcard'&&this.cwd!=='/'){this.cwd=this.cwd.replace(/\/[^\/]*$/,'')||'/';this.render();return true}return false}}`},
{id:'wd.installer',name:'Instalador',icon:'📦',permissions:['fs','apps'],main:'Installer',code:String.raw`class Installer extends AndroidApp{
 onCreate(){this.render()}
 render(){const a=this.sys.apps.list(),r=this.root;
  r.innerHTML='<div class="bar"><b>Instalar pacote .apkx</b></div><div style="padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto"><textarea rows="9" placeholder="Cole o JSON do pacote"></textarea><div style="display:flex;gap:8px"><button id="ex">Exemplo</button><button id="up">Arquivo</button><button id="ok">Instalar</button><input type="file" hidden></div><b>Instalados</b>'+a.map(x=>'<div class="row" style="cursor:default">'+x.icon+' '+x.name+' <small>v'+x.version+'</small><span class="x" data-u="'+x.id+'">🗑</span></div>').join('')+'</div>';
  const t=r.querySelector('textarea'),f=r.querySelector('input');
  r.querySelector('#ex').onclick=()=>{t.value=JSON.stringify({format:'apkx/1',id:'com.exemplo.ola',name:'Olá',icon:'👋',version:'1.0',permissions:['fs','notifications'],main:'Ola',
   code:['class Ola extends AndroidApp{','  onCreate(){','    this.root.innerHTML=\'<div class="c"><h2>Olá, mundo!</h2><button id="n">Notificar</button><button id="w">Gravar arquivo</button></div>\';','    this.root.querySelector("#n").onclick=()=>this.sys.notify({title:"Olá",text:"Vindo do app instalado"});','    this.root.querySelector("#w").onclick=()=>{this.sys.fs.writeFile("/sdcard/ola.txt","oi "+Date.now());this.sys.toast("Gravado")};','  }','}'].join('\n')},null,1)};
  r.querySelector('#up').onclick=()=>f.click();f.onchange=()=>{const fr=new FileReader();fr.onload=()=>{t.value=fr.result};fr.readAsText(f.files[0])};
  r.querySelector('#ok').onclick=()=>{try{const m=this.sys.apps.install(t.value);this.sys.toast(m.name+' instalado');this.render()}catch(e){this.sys.toast('Erro: '+e.message)}};
  r.onclick=async e=>{const u=e.target.dataset.u;if(u&&await this.sys.confirm('Desinstalar '+u+'?')){this.sys.apps.uninstall(u);this.render()}}}}`},
{id:'wd.tasks',name:'Processos',icon:'⚙️',permissions:['process'],main:'Tasks',code:String.raw`class Tasks extends AndroidApp{
 onCreate(){this.t=setInterval(()=>this.render(),1000);this.render()}
 onDestroy(){clearInterval(this.t)}
 render(){const l=this.sys.proc.list();
  this.root.innerHTML='<div class="bar"><b>Processos ('+l.length+')</b></div><div class="list">'+l.map(p=>'<div class="row" style="cursor:default">⚙ PID '+p.pid+' '+p.name+' <small>'+p.workers+' worker · '+p.uptime+'s</small><button class="x" data-k="'+p.pid+'">Encerrar</button></div>').join('')+'</div>';
  this.root.onclick=e=>{const k=e.target.dataset.k;if(k)this.sys.proc.kill(+k)}}}`},
{id:'wd.timer',name:'Worker',icon:'⏱️',permissions:['process','notifications'],main:'Timer',code:String.raw`class Timer extends AndroidApp{
 onCreate(){this.root.innerHTML='<div class="c"><h1>0</h1><small>Um Web Worker conta em segundo plano</small><button>Notificar agora</button></div>';
  this.h=this.sys.proc.spawn(function(post){var i=0;setInterval(function(){post(++i)},1000)},v=>{
   const e=this.root.querySelector('h1');if(e)e.textContent=v;
   if(v%15===0)this.sys.notify({title:'Worker',text:v+'s de execução'})});
  this.root.querySelector('button').onclick=()=>this.sys.notify({title:'Olá',text:'Notificação de teste'})}}`},
{id:'wd.notes',name:'Notas',icon:'📝',permissions:['fs','notifications'],main:'Notes',code:String.raw`class Notes extends AndroidApp{
 onCreate(){const f='/sdcard/Documents/nota.txt',fs=this.sys.fs;
  this.root.innerHTML='<textarea style="flex:1;border-radius:0"></textarea><div class="bar"><button>Salvar</button></div>';
  const t=this.root.querySelector('textarea');if(fs.exists(f))t.value=fs.readFile(f);
  this.root.querySelector('button').onclick=()=>{fs.writeFile(f,t.value);this.sys.toast('Salvo em '+f);this.sys.notify({title:'Nota salva',text:f})}}}`}
